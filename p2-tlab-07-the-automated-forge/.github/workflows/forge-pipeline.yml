name: The Automated Forge
on:
  push:
    branches:
      - main
jobs:
  forge_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: echo "Simulating Backend Initialization... Passed."
      - name: SAST Quality Gate (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: p2-week-07-tlab-07
          additional_args: --soft-fail=true
